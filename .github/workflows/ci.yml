name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: file:./test.db

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: file:./build.db

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64 only on PR for speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: tailor-resume:ci
          cache-from: type=gha,scope=tailor-resume
          cache-to: type=gha,mode=max,scope=tailor-resume

      - name: Smoke test runtime container
        run: |
          docker run --rm -d \
            -e DATABASE_URL="file:/data/tailor.db" \
            -e JWT_SECRET="ci-secret" \
            -e ANTHROPIC_API_KEY="sk-ant-placeholder" \
            -p 3000:3000 \
            --name tailor-ci tailor-resume:ci
          # wait for healthz to come up (max 60s)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/healthz >/dev/null 2>&1; then
              echo "ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/healthz
          curl -fsS http://localhost:3000/api/readyz
          docker logs tailor-ci | tail -50
          docker stop tailor-ci
