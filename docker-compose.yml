# Self-hosted runtime for the GHCR image.
# Usage:
#   docker compose pull && docker compose up -d
#
# Override the image tag with TAILOR_IMAGE (default: latest from main).
# DB persists in the named volume `tailor-data` as /data/tailor.db.
# `prisma db push` runs on every boot (idempotent) so pulling a newer image
# automatically applies any schema changes.

services:
  tailor-resume:
    image: ${TAILOR_IMAGE:-ghcr.io/wankhede04/tailor-resume:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/tailor.db
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
    ports:
      - "${TAILOR_PORT:-3000}:3000"
    volumes:
      - tailor-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tailor-data:
